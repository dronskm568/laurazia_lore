<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Laboratory-Supply-Protocol: схема сигнальної лінії</title>
<desc id="d">Схема сигнальної лінії від лабораторії через ретрансляційні вузли до розподільчого цеху станції постачання M4.3 і таблиця ударних кодів.</desc>
<style>
.paper{fill:#efe6d0}
.frame{fill:none;stroke:#3a342b;stroke-width:3}
.room{fill:#e4d9bd;stroke:#3a342b;stroke-width:3}
.shaft{fill:#cfc3a3;stroke:#3a342b;stroke-width:3}
.conn{stroke:#3a342b;stroke-width:6;fill:none;stroke-linecap:round}
.thin{stroke:#3a342b;stroke-width:2;fill:none}
.lab{font:600 16px "Courier New",Courier,monospace;fill:#2a251e;text-anchor:middle}
.sub{font:14px "Courier New",Courier,monospace;fill:#6b6252}
.lvl{font:700 17px "Courier New",Courier,monospace;fill:#2a251e}
.title{font:700 28px "Courier New",Courier,monospace;fill:#2a251e}
.note{font:14px "Courier New",Courier,monospace;fill:#2a251e}
.stamp{font:700 26px "Courier New",Courier,monospace;fill:#8c2f2f;text-anchor:middle}
</style>
<defs>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#cfc3a3"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6b6252" stroke-width="2"/></pattern>
</defs>
<rect class="paper" width="1200" height="900"/>
<rect class="frame" x="16" y="16" width="1168" height="868"/>
