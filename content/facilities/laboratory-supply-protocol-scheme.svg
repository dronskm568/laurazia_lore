<text class="title" x="50" y="70">LABORATORY-SUPPLY-PROTOCOL</text>
<text class="sub" x="50" y="98">Схема сигнальної лінії</text>
<g transform="rotate(-6 1010 80)"><rect x="880" y="48" width="260" height="48" fill="none" stroke="#8c2f2f" stroke-width="3"/><text class="stamp" x="1010" y="82">СЕКРЕТНО</text></g>
<rect x="40" y="150" width="1120" height="230" fill="url(#hatch)" stroke="#3a342b" stroke-width="2"/>
<text class="sub" x="60" y="174">Порода</text>
