<rect class="room" x="900" y="200" width="230" height="120"/><text class="lab" x="1015.0" y="255.0">Станція M4.3</text><text class="lab" x="1015.0" y="275.0">розподільчий цех</text>
<rect class="shaft" x="300" y="250" width="40" height="20"/><text class="sub" x="320" y="240" text-anchor="middle">стояк</text>
<line class="conn" x1="340" y1="260" x2="900" y2="260"/>
<circle cx="520" cy="260" r="22" fill="#e4d9bd" stroke="#3a342b" stroke-width="3"/><text class="lab" x="520" y="266" text-anchor="middle">Р1</text>
<circle cx="720" cy="260" r="22" fill="#e4d9bd" stroke="#3a342b" stroke-width="3"/><text class="lab" x="720" y="266" text-anchor="middle">Р2</text>
<text class="sub" x="520" y="310" text-anchor="middle">ретрансляційний вузол</text>
<text class="sub" x="720" y="310" text-anchor="middle">ретрансляційний вузол</text>
<text class="note" x="600" y="235" text-anchor="middle">сигнальна лінія (сталева штанга)</text>
<text class="lvl" x="50" y="430">Таблиця кодів</text>
