<rect x="420" y="658" width="52" height="14" fill="#2a251e"/><rect x="488" y="658" width="52" height="14" fill="#2a251e"/><line class="thin" x1="50" y1="700" x2="1150" y2="700"/><text class="note" x="60" y="730">Скасування</text>
