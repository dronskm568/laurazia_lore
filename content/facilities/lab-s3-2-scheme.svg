<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Lab-S3.2: схема розташування приміщень</title>
<desc id="d">Вертикальний розріз підземної лабораторії Lab-S3.2: п'ять рівнів, ліфт, сходи та вентиляція.</desc>
<style>
